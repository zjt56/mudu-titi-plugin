<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <style>
      @keyframes node-pulse { 0% { transform: scale(1); opacity: .75 } 70% { transform: scale(1.6); opacity: 0 } 100% { transform: scale(1.6); opacity: 0 } }
      @keyframes node-breathe { 0%, 100% { opacity: .3 } 50% { opacity: 1 } }
      @keyframes flow-dash { to { stroke-dashoffset: -22 } }
      .pulse { transform-box: fill-box; transform-origin: center; animation: node-pulse 1.5s ease-out infinite; }
      .breathe { transform-box: fill-box; transform-origin: center; animation: node-breathe 1.2s ease-in-out infinite; }
      .live { stroke-dasharray: 6 5; animation: flow-dash 1s linear infinite; }
      .label { font-size: 13px; font-weight: 500; fill: #5b6068; text-anchor: middle; }
      .sub { font-size: 12px; fill: #8a9099; text-anchor: middle; }
      .title { font-size: 17px; font-weight: 600; fill: #1d2129; text-anchor: middle; }
      .legend { font-size: 12.5px; fill: #5b6068; }
      @media (prefers-reduced-motion: reduce) { .pulse, .breathe, .live { animation: none } }
    </style>
  </defs>

  <rect width="980" height="520" fill="#ffffff"/>
  <text x="490" y="40" class="title">流程图节点与连接线样式（自绘 SVG）</text>
  <text x="490" y="64" class="sub">上排：节点三态 ｜ 下排：连接线三态</text>

  <!-- ============ 上排：节点三态 ============ -->
  <!-- 已完成 -->
  <g>
    <circle cx="180" cy="150" r="14" fill="#eef0f3" stroke="#9aa0aa" stroke-width="1.6"/>
    <text x="180" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#5b6068">✓</text>
    <text x="180" y="192" class="label">内容提取</text>
    <text x="180" y="212" class="sub">已完成</text>
  </g>
  <!-- 未运行 -->
  <g>
    <circle cx="400" cy="150" r="14" fill="#f7f8fa" stroke="#d8dae0" stroke-width="1.6"/>
    <text x="400" y="192" class="label" style="fill:#8a9099">结构确认</text>
    <text x="400" y="212" class="sub">未运行</text>
  </g>
  <!-- 运行中 -->
  <g>
    <circle class="pulse" cx="620" cy="150" r="14" fill="none" stroke="#8a9099" stroke-width="1.4"/>
    <circle cx="620" cy="150" r="14" fill="#f1f2f5" stroke="#6f7580" stroke-width="1.8"/>
    <circle class="breathe" cx="620" cy="150" r="5" fill="#3c4149"/>
    <text x="620" y="192" class="label" style="font-weight:700;fill:#3c4149">答案填充</text>
    <text x="620" y="212" class="sub">运行中（脉冲 + 呼吸）</text>
  </g>
  <!-- 告警：差异 -->
  <g>
    <circle cx="800" cy="150" r="14" fill="#fbf3e8" stroke="#c9963c" stroke-width="1.8"/>
    <text x="800" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#b07a1f">!</text>
    <text x="800" y="192" class="label">内容审核</text>
    <text x="800" y="212" class="sub">已执行，有差异</text>
  </g>

  <!-- ============ 下排：连接线三态 ============ -->
  <!-- 已走过 -->
  <g>
    <circle cx="180" cy="350" r="12" fill="#eef0f3" stroke="#9aa0aa" stroke-width="1.5"/>
    <path d="M 196 350 L 352 350" stroke="#c6c9d0" stroke-width="2.2" stroke-opacity=".7" fill="none" stroke-linecap="round"/>
    <path d="M 348 346 L 356 350 L 348 354 Z" fill="#c6c9d0" opacity=".7"/>
    <circle cx="368" cy="350" r="12" fill="#eef0f3" stroke="#9aa0aa" stroke-width="1.5"/>
    <text x="274" y="392" class="legend" text-anchor="middle">已走过：中性实线</text>
  </g>
  <!-- 运行中连线 -->
  <g>
    <circle cx="180" cy="450" r="12" fill="#eef0f3" stroke="#9aa0aa" stroke-width="1.5"/>
    <path class="live" d="M 196 450 L 352 450" stroke="#8a9099" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 348 446 L 356 450 L 348 454 Z" fill="#8a9099"/>
    <circle class="pulse" cx="368" cy="450" r="12" fill="none" stroke="#8a9099" stroke-width="1.3"/>
    <circle cx="368" cy="450" r="12" fill="#f1f2f5" stroke="#6f7580" stroke-width="1.6"/>
    <circle class="breathe" cx="368" cy="450" r="4.5" fill="#3c4149"/>
    <text x="274" y="492" class="legend" text-anchor="middle">运行中：流动虚线 + 呼吸节点</text>
  </g>
  <!-- 未走连线 -->
  <g>
    <circle cx="580" cy="450" r="12" fill="#f7f8fa" stroke="#d8dae0" stroke-width="1.5"/>
    <path d="M 596 450 L 752 450" stroke="#d8dae0" stroke-width="1.8" stroke-dasharray="2 4" fill="none" stroke-linecap="round"/>
    <path d="M 748 446 L 756 450 L 748 454 Z" fill="#d8dae0"/>
    <circle cx="768" cy="450" r="12" fill="#f7f8fa" stroke="#d8dae0" stroke-width="1.5"/>
    <text x="674" y="492" class="legend" text-anchor="middle">未走：浅色虚线</text>
  </g>
</svg>
