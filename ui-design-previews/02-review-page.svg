  <!-- Exam Paper Content (serif typography preserved) -->
  <text x="252" y="168" font-family="Georgia, 'Times New Roman', 'Songti SC', serif" font-size="13.5" font-weight="700" fill="#111827">III. 完形填空（共 10 小题；每小题 1 分，满分 10 分）</text>
  <text x="252" y="196" font-family="Georgia, 'Times New Roman', 'Songti SC', serif" font-size="13.5" fill="#111827">Last summer, my grandfather taught me how to plant tomatoes in our small yard. At first,</text>
  <text x="252" y="220" font-family="Georgia, 'Times New Roman', 'Songti SC', serif" font-size="13.5" fill="#111827">I thought it would be easy, but I soon realized it required being ___21___ and checking the</text>
  <text x="252" y="244" font-family="Georgia, 'Times New Roman', 'Songti SC', serif" font-size="13.5" fill="#111827">soil every morning. Whenever the weather turned hot, he reminded me to ___22___ the plants</text>
  <text x="252" y="268" font-family="Georgia, 'Times New Roman', 'Songti SC', serif" font-size="13.5" fill="#111827">before sunset so the leaves would not dry out.</text>

  <text x="252" y="306" font-family="Georgia, 'Times New Roman', 'Songti SC', serif" font-size="13.5" fill="#111827">21. A. happy          B. proud          C. patient          D. quiet</text>
  <text x="252" y="332" font-family="Georgia, 'Times New Roman', 'Songti SC', serif" font-size="13.5" fill="#111827">22. A. water          B. pick           C. count            D. cover</text>
  <text x="252" y="358" font-family="Georgia, 'Times New Roman', 'Songti SC', serif" font-size="13.5" fill="#6B7280">……（其余小题 23–30 略）</text>

