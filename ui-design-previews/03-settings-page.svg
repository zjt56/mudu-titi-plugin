<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif">
  <!-- Canvas -->
  <rect width="1280" height="780" fill="#F7F8FA"/>

  <!-- Top Tabbar (52px) -->
  <rect x="0" y="0" width="1280" height="52" fill="#FFFFFF"/>
  <line x1="0" y1="52" x2="1280" y2="52" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Brand -->
  <rect x="18" y="14" width="24" height="24" rx="6" fill="#EFF7FF"/>
  <path d="M25.5 20h5L33 22.5V30h-7.5z" fill="none" stroke="#0088FF" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M30.5 20v2.5H33M27.5 25.5h3.5M27.5 27.8h3.5" fill="none" stroke="#0088FF" stroke-width="1.3" stroke-linecap="round"/>
  <text x="50" y="30.5" font-size="13.5" font-weight="600" fill="#111827">录题系统</text>

  <!-- Segmented Tabs -->
  <rect x="128" y="10" width="260" height="32" rx="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  <text x="173" y="30.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#6B7280">上传试卷</text>
  <text x="258" y="30.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#6B7280">试卷审核</text>
  <rect x="301" y="13" width="84" height="26" rx="6" fill="#FFFFFF"/>
  <text x="343" y="30.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0088FF">模型与设置</text>

  <!-- ================= LEFT SETTINGS NAV (x=0..184) ================= -->
  <rect x="0" y="52" width="184" height="728" fill="#FFFFFF"/>
  <line x1="184" y1="52" x2="184" y2="780" stroke="#E5E7EB" stroke-width="1"/>

  <text x="22" y="84" font-size="11.5" font-weight="500" fill="#9CA3AF">配置</text>

  <!-- Active Nav Item (clean soft blue fill, no warped corner bar) -->
  <rect x="12" y="96" width="160" height="38" rx="7" fill="#EFF7FF"/>
  <text x="24" y="119.5" font-size="13" font-weight="600" fill="#0066CC">大模型配置</text>

  <text x="24" y="161.5" font-size="13" font-weight="500" fill="#6B7280">上传设置</text>
  <text x="24" y="203.5" font-size="13" font-weight="500" fill="#6B7280">OCR 识别</text>
  <text x="24" y="245.5" font-size="13" font-weight="500" fill="#6B7280">听力切分</text>

  <!-- ================= RIGHT CONTENT AREA (centered x=312..1112, width=800) ================= -->
  <text x="312" y="96" font-size="18" font-weight="600" fill="#111827">大模型配置</text>
  <text x="312" y="118" font-size="12" fill="#6B7280">配置全局默认模型，以及各子 Agent、文章大意/解析与两轮审核使用的模型。</text>

  <!-- Card 1: 默认模型（全局） -->
  <rect x="312" y="138" width="800" height="148" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="332" y="166" font-size="13.5" font-weight="600" fill="#111827">默认模型（全局）</text>

  <text x="332" y="194" font-size="12" font-weight="500" fill="#6B7280">供应商</text>
  <rect x="332" y="202" width="372" height="34" rx="7" fill="#FFFFFF" stroke="#0088FF" stroke-width="1.2"/>
  <text x="344" y="223.5" font-size="12.5" fill="#111827">默认模型网关</text>
  <path d="M688 217l4 4 4-4" fill="none" stroke="#6B7280" stroke-width="1.4" stroke-linecap="round"/>

  <text x="720" y="194" font-size="12" font-weight="500" fill="#6B7280">模型</text>
  <rect x="720" y="202" width="372" height="34" rx="7" fill="#FFFFFF" stroke="#D5DCE4" stroke-width="1"/>
  <text x="732" y="223.5" font-size="12.5" fill="#111827">gemini-2.5-pro</text>
  <path d="M1076 217l4 4 4-4" fill="none" stroke="#6B7280" stroke-width="1.4" stroke-linecap="round"/>

  <text x="332" y="266" font-size="11.5" fill="#9CA3AF">未单独指定的阶段将自动跟随此默认模型。</text>
  <rect x="910" y="248" width="86" height="28" rx="7" fill="#FFFFFF" stroke="#D5DCE4" stroke-width="1"/>
  <text x="953" y="266.5" text-anchor="middle" font-size="12" font-weight="500" fill="#374151">测试连通性</text>
  <rect x="1006" y="248" width="86" height="28" rx="7" fill="#0088FF"/>
  <text x="1049" y="266.5" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">保存默认</text>

  <!-- Card 2: 各子 Agent 模型 -->
  <rect x="312" y="302" width="800" height="224" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="332" y="330" font-size="13.5" font-weight="600" fill="#111827">各子 Agent 模型</text>

  <!-- Row 1 -->
  <text x="332" y="366" font-size="12.5" fill="#374151">原卷提取与结构确认</text>
  <rect x="520" y="346" width="572" height="32" rx="7" fill="#F9FAFB" stroke="#D5DCE4" stroke-width="1"/>
  <text x="532" y="366.5" font-size="12.5" fill="#6B7280">跟随默认</text>
  <path d="M1076 360l4 4 4-4" fill="none" stroke="#9CA3AF" stroke-width="1.4" stroke-linecap="round"/>

  <line x1="332" y1="388" x2="1092" y2="388" stroke="#F0F2F5" stroke-width="1"/>

  <!-- Row 2 -->
  <text x="332" y="414" font-size="12.5" fill="#374151">题型判断与答案填充</text>
  <rect x="520" y="394" width="572" height="32" rx="7" fill="#FFFFFF" stroke="#D5DCE4" stroke-width="1"/>
  <text x="532" y="414.5" font-size="12.5" fill="#111827">gemini-2.5-flash</text>
  <path d="M1076 408l4 4 4-4" fill="none" stroke="#6B7280" stroke-width="1.4" stroke-linecap="round"/>

  <line x1="332" y1="436" x2="1092" y2="436" stroke="#F0F2F5" stroke-width="1"/>

  <!-- Row 3 -->
  <text x="332" y="462" font-size="12.5" fill="#374151">知识点标注</text>
  <rect x="520" y="442" width="572" height="32" rx="7" fill="#F9FAFB" stroke="#D5DCE4" stroke-width="1"/>
  <text x="532" y="462.5" font-size="12.5" fill="#6B7280">跟随默认</text>
  <path d="M1076 456l4 4 4-4" fill="none" stroke="#9CA3AF" stroke-width="1.4" stroke-linecap="round"/>

  <line x1="332" y1="484" x2="1092" y2="484" stroke="#F0F2F5" stroke-width="1"/>

  <!-- Row 4 -->
  <text x="332" y="510" font-size="12.5" fill="#374151">两轮审核模型</text>
  <rect x="520" y="490" width="572" height="32" rx="7" fill="#FFFFFF" stroke="#D5DCE4" stroke-width="1"/>
  <text x="532" y="510.5" font-size="12.5" fill="#111827">claude-sonnet-4</text>
  <path d="M1076 504l4 4 4-4" fill="none" stroke="#6B7280" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Card 3: 策略开关与写入 -->
  <rect x="312" y="542" width="800" height="202" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="332" y="570" font-size="13.5" font-weight="600" fill="#111827">文章大意、答案解析与运行策略</text>

  <!-- Switch 1 (ON = #0088FF) -->
  <text x="332" y="604" font-size="13" font-weight="500" fill="#111827">缺失解析允许 AI 补全</text>
  <text x="332" y="622" font-size="11.5" fill="#6B7280">在审核页可一键为无解析小题生成简要解析，并自动标注来源。</text>
  <rect x="1050" y="594" width="42" height="24" rx="12" fill="#0088FF"/>
  <circle cx="1080" cy="606" r="9" fill="#FFFFFF"/>

  <line x1="332" y1="640" x2="1092" y2="640" stroke="#F0F2F5" stroke-width="1"/>

  <!-- Switch 2 (OFF = #D1D5DB) -->
  <text x="332" y="668" font-size="13" font-weight="500" fill="#111827">允许无音频试卷跳过听力阻断</text>
  <text x="332" y="686" font-size="11.5" fill="#6B7280">仅在历史真题缺少录音文件时临时开启，默认关闭。</text>
  <rect x="1050" y="658" width="42" height="24" rx="12" fill="#D1D5DB"/>
  <circle cx="1062" cy="670" r="9" fill="#FFFFFF"/>

  <line x1="332" y1="702" x2="1092" y2="702" stroke="#EAEEF3" stroke-width="1"/>

  <rect x="892" y="712" width="82" height="28" rx="7" fill="#FFFFFF" stroke="#D5DCE4" stroke-width="1"/>
  <text x="933" y="730.5" text-anchor="middle" font-size="12" font-weight="500" fill="#374151">恢复默认</text>
  <rect x="984" y="712" width="108" height="28" rx="7" fill="#0088FF"/>
  <text x="1038" y="730.5" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">写入生效配置</text>
</svg>
