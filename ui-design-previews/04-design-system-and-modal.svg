<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif">
  <!-- Canvas -->
  <rect width="1280" height="780" fill="#F7F8FA"/>

  <!-- Header -->
  <text x="28" y="42" font-size="18" font-weight="600" fill="#111827">简约蓝色系视觉规范</text>
  <text x="206" y="42" font-size="12.5" fill="#6B7280">低装饰 · 克制用蓝 · 无多余阴影 · 聚焦核心操作</text>

  <!-- ================= LEFT PANEL: COLOR & BUTTON SPEC (x=28..468, width=440) ================= -->

  <!-- Card 1: 色彩体系 -->
  <rect x="28" y="64" width="440" height="264" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="48" y="92" font-size="13.5" font-weight="600" fill="#111827">色彩体系（白灰为底，主蓝点睛）</text>

  <!-- Blue Row -->
  <text x="48" y="118" font-size="11.5" font-weight="500" fill="#6B7280">品牌蓝色（仅用于主按钮、选中态、当前进度）</text>

  <rect x="48" y="128" width="94" height="44" rx="7" fill="#0088FF"/>
  <text x="48" y="187" font-size="11.5" font-weight="600" fill="#111827">#0088FF</text>
  <text x="48" y="201" font-size="10.5" fill="#6B7280">主色 / CTA</text>

  <rect x="150" y="128" width="94" height="44" rx="7" fill="#0073E6"/>
  <text x="150" y="187" font-size="11.5" font-weight="600" fill="#111827">#0073E6</text>
  <text x="150" y="201" font-size="10.5" fill="#6B7280">悬停态</text>

  <rect x="252" y="128" width="94" height="44" rx="7" fill="#EFF7FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="252" y="187" font-size="11.5" font-weight="600" fill="#111827">#EFF7FF</text>
  <text x="252" y="201" font-size="10.5" fill="#6B7280">选中底色</text>

  <rect x="354" y="128" width="94" height="44" rx="7" fill="#0066CC"/>
  <text x="354" y="187" font-size="11.5" font-weight="600" fill="#111827">#0066CC</text>
  <text x="354" y="201" font-size="10.5" fill="#6B7280">浅底蓝字</text>

  <!-- Neutral Row -->
  <text x="48" y="228" font-size="11.5" font-weight="500" fill="#6B7280">中性层级（90% 界面面积保持干净灰白）</text>

  <rect x="48" y="238" width="94" height="36" rx="7" fill="#F7F8FA" stroke="#E5E7EB" stroke-width="1"/>
  <text x="48" y="290" font-size="11" font-weight="600" fill="#111827">#F7F8FA</text>
  <text x="48" y="304" font-size="10.5" fill="#6B7280">页面底色</text>

  <rect x="150" y="238" width="94" height="36" rx="7" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="150" y="290" font-size="11" font-weight="600" fill="#111827">#FFFFFF</text>
  <text x="150" y="304" font-size="10.5" fill="#6B7280">卡片表面</text>

  <rect x="252" y="238" width="94" height="36" rx="7" fill="#E5E7EB"/>
  <text x="252" y="290" font-size="11" font-weight="600" fill="#111827">#E5E7EB</text>
  <text x="252" y="304" font-size="10.5" fill="#6B7280">1px 细边框</text>

  <rect x="354" y="238" width="94" height="36" rx="7" fill="#111827"/>
  <text x="354" y="290" font-size="11" font-weight="600" fill="#111827">#111827</text>
  <text x="354" y="304" font-size="10.5" fill="#6B7280">主文字</text>

  <!-- Card 2: 按钮层级（精简为三级） -->
  <rect x="28" y="344" width="440" height="236" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="48" y="372" font-size="13.5" font-weight="600" fill="#111827">按钮层级（精简克制，无发光阴影）</text>

  <!-- Level 1 -->
  <rect x="48" y="390" width="96" height="32" rx="7" fill="#0088FF"/>
  <text x="96" y="410.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#FFFFFF">上传 / 保存</text>
  <text x="158" y="404" font-size="12" font-weight="600" fill="#111827">主按钮（每区仅 1 个）</text>
  <text x="158" y="420" font-size="11" fill="#6B7280">纯色 #0088FF 实底白字，扁平利落</text>

  <!-- Level 2 -->
  <rect x="48" y="438" width="96" height="32" rx="7" fill="#EFF7FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="96" y="458.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0066CC">原卷修改</text>
  <text x="158" y="452" font-size="12" font-weight="600" fill="#111827">轻蓝按钮（次重点）</text>
  <text x="158" y="468" font-size="11" fill="#6B7280">浅蓝底 + 细框，不抢主按钮视觉焦点</text>

  <!-- Level 3 -->
  <rect x="48" y="486" width="96" height="32" rx="7" fill="#FFFFFF" stroke="#D5DCE4" stroke-width="1"/>
  <text x="96" y="506.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#374151">取消 / 刷新</text>
  <text x="158" y="500" font-size="12" font-weight="600" fill="#111827">常规按钮（默认）</text>
  <text x="158" y="516" font-size="11" fill="#6B7280">纯白底 + 灰框，保持大面积清爽</text>

  <!-- Danger -->
  <rect x="48" y="534" width="96" height="32" rx="7" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="96" y="554.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#DC2626">删除 / 驳回</text>
  <text x="158" y="548" font-size="12" font-weight="600" fill="#111827">警示按钮（低干扰）</text>
  <text x="158" y="564" font-size="11" fill="#6B7280">白底红字，悬停时才出现极浅红底</text>

  <!-- Card 3: 状态与表单细节 -->
  <rect x="28" y="596" width="440" height="160" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="48" y="624" font-size="13.5" font-weight="600" fill="#111827">状态提示与表单聚焦</text>

  <!-- Minimal Status Indicators -->
  <circle cx="56" cy="656" r="3.5" fill="#16A34A"/>
  <text x="66" y="660" font-size="12" fill="#374151">正常 / 已完成</text>

  <circle cx="176" cy="656" r="3.5" fill="#0088FF"/>
  <text x="186" y="660" font-size="12" fill="#374151">进行中</text>

  <circle cx="256" cy="656" r="3.5" fill="#D97706"/>
  <text x="266" y="660" font-size="12" fill="#374151">待人工审</text>

  <circle cx="348" cy="656" r="3.5" fill="#DC2626"/>
  <text x="358" y="660" font-size="12" fill="#374151">异常 / 差异</text>

  <!-- Focus Input & Switch -->
  <rect x="48" y="684" width="248" height="34" rx="7" fill="#FFFFFF" stroke="#0088FF" stroke-width="1.4"/>
  <text x="60" y="705.5" font-size="12.5" fill="#111827">输入框聚焦：1.4px 蓝色细边</text>

  <rect x="320" y="689" width="42" height="24" rx="12" fill="#0088FF"/>
  <circle cx="350" cy="701" r="9" fill="#FFFFFF"/>
  <rect x="374" y="689" width="42" height="24" rx="12" fill="#D1D5DB"/>
  <circle cx="386" cy="701" r="9" fill="#FFFFFF"/>
  <text x="320" y="734" font-size="11" fill="#6B7280">开关：开 #0088FF / 关 #D1D5DB</text>

  <!-- ================= RIGHT PANEL: 原卷修改弹窗预览 (x=492..1252, width=760) ================= -->
  <rect x="492" y="64" width="760" height="692" rx="12" fill="#FFFFFF" stroke="#D5DCE4" stroke-width="1"/>

  <!-- Modal Header -->
  <text x="514" y="96" font-size="14.5" font-weight="600" fill="#111827">原卷修改</text>
  <rect x="582" y="80" width="128" height="22" rx="11" fill="#EFF7FF"/>
  <text x="646" y="95" text-anchor="middle" font-size="11.5" font-weight="500" fill="#0066CC">第 21–30 题（10 小题）</text>
  <text x="724" y="95" font-size="11.5" fill="#D97706">未保存</text>
  <text x="1226" y="96" text-anchor="middle" font-size="16" fill="#9CA3AF">×</text>
  <line x1="492" y1="114" x2="1252" y2="114" stroke="#EAEEF3" stroke-width="1"/>

  <!-- Notice (subtle gray, not loud blue) -->
  <rect x="514" y="130" width="716" height="34" rx="8" fill="#F9FAFB" stroke="#EAEEF3" stroke-width="1"/>
  <text x="528" y="151.5" font-size="12" fill="#6B7280">此处仅修改原卷正文/材料与小题题干、选项、答案；文章大意与解析请在下方卡片修改。</text>

  <!-- Section 1: 正文 / 材料 -->
  <rect x="514" y="178" width="716" height="176" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="530" y="202" font-size="12.5" font-weight="600" fill="#111827">正文 / 材料</text>
  <text x="606" y="202" font-size="11.5" fill="#9CA3AF">整组共用 · 含阅读原文、听力原文</text>
  <text x="1214" y="202" text-anchor="end" font-size="11.5" fill="#9CA3AF">248 字</text>

  <rect x="530" y="214" width="684" height="124" rx="7" fill="#FFFFFF" stroke="#D5DCE4" stroke-width="1"/>
  <text x="542" y="238" font-family="Georgia, 'Times New Roman', 'Songti SC', serif" font-size="13" fill="#111827">Last summer, my grandfather taught me how to plant tomatoes in our small yard.</text>
  <text x="542" y="262" font-family="Georgia, 'Times New Roman', 'Songti SC', serif" font-size="13" fill="#111827">At first, I thought it would be easy, but I soon realized it required being ___21___</text>
  <text x="542" y="286" font-family="Georgia, 'Times New Roman', 'Songti SC', serif" font-size="13" fill="#111827">and checking the soil every morning...</text>

  <!-- Section 2: 小题内容 -->
  <text x="514" y="382" font-size="12.5" font-weight="600" fill="#111827">小题内容</text>
  <text x="574" y="382" font-size="11.5" fill="#9CA3AF">共 10 小题</text>
  <rect x="1162" y="366" width="68" height="24" rx="6" fill="#FFFFFF" stroke="#D5DCE4" stroke-width="1"/>
  <text x="1196" y="382" text-anchor="middle" font-size="11.5" fill="#374151">全部展开</text>

  <!-- Sub Card 21 (Expanded) -->
  <rect x="514" y="398" width="716" height="226" rx="9" fill="#FFFFFF" stroke="#D5DCE4" stroke-width="1"/>
  <rect x="515" y="399" width="714" height="38" rx="8" fill="#F9FAFB"/>
  <line x1="514" y1="437" x2="1230" y2="437" stroke="#EAEEF3" stroke-width="1"/>
  <rect x="526" y="407" width="26" height="22" rx="5" fill="#EFF7FF"/>
  <text x="539" y="422" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0066CC">21</text>
  <text x="562" y="422.5" font-size="12.5" font-weight="600" fill="#111827">第 21 题</text>
  <text x="622" y="422.5" font-size="11.5" fill="#6B7280">A. happy  B. proud  C. patient  D. quiet</text>
  <rect x="1146" y="408" width="48" height="20" rx="10" fill="#F3F4F6"/>
  <text x="1170" y="422" text-anchor="middle" font-size="11" font-weight="500" fill="#374151">答 C</text>
  <text x="1210" y="422" text-anchor="middle" font-size="12" fill="#6B7280">▾</text>

  <!-- Sub Body -->
  <text x="530" y="460" font-size="11.5" font-weight="500" fill="#6B7280">选项（每行一项）</text>
  <rect x="530" y="468" width="684" height="84" rx="7" fill="#FFFFFF" stroke="#D5DCE4" stroke-width="1"/>
  <text x="542" y="488" font-family="Georgia, 'Times New Roman', 'Songti SC', serif" font-size="12.5" fill="#111827">A. happy</text>
  <text x="542" y="506" font-family="Georgia, 'Times New Roman', 'Songti SC', serif" font-size="12.5" fill="#111827">B. proud</text>
  <text x="542" y="524" font-family="Georgia, 'Times New Roman', 'Songti SC', serif" font-size="12.5" fill="#111827">C. patient</text>
  <text x="542" y="542" font-family="Georgia, 'Times New Roman', 'Songti SC', serif" font-size="12.5" fill="#111827">D. quiet</text>

  <text x="530" y="572" font-size="11.5" font-weight="500" fill="#6B7280">答案</text>
  <rect x="530" y="580" width="684" height="32" rx="7" fill="#FFFFFF" stroke="#0088FF" stroke-width="1.2"/>
  <text x="542" y="600.5" font-family="Georgia, 'Times New Roman', 'Songti SC', serif" font-size="13" fill="#111827">C</text>

  <!-- Sub Card 22 (Collapsed) -->
  <rect x="514" y="634" width="716" height="40" rx="9" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="526" y="643" width="26" height="22" rx="5" fill="#F3F4F6"/>
  <text x="539" y="658" text-anchor="middle" font-size="11.5" font-weight="600" fill="#374151">22</text>
  <text x="562" y="658.5" font-size="12.5" font-weight="500" fill="#111827">第 22 题</text>
  <text x="622" y="658.5" font-size="11.5" fill="#6B7280">A. water  B. pick  C. count  D. cover</text>
  <rect x="1146" y="644" width="48" height="20" rx="10" fill="#F3F4F6"/>
  <text x="1170" y="658" text-anchor="middle" font-size="11" font-weight="500" fill="#374151">答 A</text>
  <text x="1210" y="658" text-anchor="middle" font-size="12" fill="#9CA3AF">▸</text>

  <!-- Modal Footer -->
  <line x1="492" y1="698" x2="1252" y2="698" stroke="#EAEEF3" stroke-width="1"/>
  <rect x="1062" y="712" width="68" height="30" rx="7" fill="#FFFFFF" stroke="#D5DCE4" stroke-width="1"/>
  <text x="1096" y="731.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#374151">取消</text>
  <rect x="1140" y="712" width="90" height="30" rx="7" fill="#0088FF"/>
  <text x="1185" y="731.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#FFFFFF">保存内容</text>
</svg>
