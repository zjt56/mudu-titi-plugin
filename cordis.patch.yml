# 录题工作流插件版 · bundle 加载层
# DSH 启用 md-upload-tiku 时自动加载本文件。
# 这里插入插件自己的宿主行（Host 半边 index.js），客户端半边由 package.json 的
# dsh.client 声明，由 clientModules 服务自动注入。
#
# 注意：不要把这些行抄进 profile 的 cordis.patch.yml，否则会重复 entry id。
# 需要改本插件配置时，在 profile 的 cordis.patch.yml 写顶层的 `- id: wf-plugin` 覆盖行。
- insert:
    - id: wf-plugin
      name: md-upload-tiku
