name: CI (Windows)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check host plugin JS syntax
        run: node --check lib/index.js lib/client.js

      - name: Run Node tests
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem -Path backend -Filter *.test.cjs) + @(Get-ChildItem -Path backend -Filter *.test.mjs)
          node --test @($tests | ForEach-Object { $_.FullName })

      - name: Run Python workflow tests
        working-directory: app
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s workflow -p "test_*.py" -v

      - name: Run Python workbench tests
        working-directory: app
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s workbench -p "test_*.py" -v
